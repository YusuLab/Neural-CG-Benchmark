task:
  type: ChipFPGASiteUtilizationTask
  dataset: ChipFPGADataset
  dataset_config:
    source: ispd16
    length: 8
  ood_dataset: ChipFPGADataset
  ood_config:
    source: ispd16
    length: 2
backbone:
  type: GAT
  input_dim: 64
  output_dim: 64
  n_heads: 4
  n_layers: 3
  feed_forward_hidden_dim: 128
batch_size: 1
learning_rate: 1.e-4
loss_function: mse_loss

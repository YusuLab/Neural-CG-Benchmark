task:
  type: ConvexHullMembershipTask
  dataset: ModelNetPointset
  dataset_config:
    name: '10'
    size: 256
  ood_dataset: ModelNetPointset
  ood_dataset_config:
    name: '10'
    size: 512
backbone:
  type: Transformer
  n_heads: 1
  n_layers: 3
  d_model: 16
  feed_forward_hidden_dim: 64
batch_size: 32
learning_rate: 1.e-4
loss_function: scatter_binary_focal_loss
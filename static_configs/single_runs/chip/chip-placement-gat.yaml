task:
  type: ChipPlacementTask
  dataset: ChipSyntheticDataset
  dataset_config:
    length: 100
  ood_dataset: ChipSyntheticDataset
  ood_config:
    length: 20
backbone:
  type: GAT
  input_dim: 64
  output_dim: 64
  n_heads: 4
  n_layers: 3
  feed_forward_hidden_dim: 128
batch_size: 4
learning_rate: 1.e-4
loss_function: mse_loss

task:
  type: HausdorffDistanceTask
  dataset: SQUIDBoundaries
  dataset_config:
    length: 100
    normalization: true
  ood_dataset: SQUIDBoundaries
  ood_config:
    length: 10
    normalization: true
backbone:
  type: CoupledNetwork
  latent_dimension: 32
  p: 1
  reconstruct_input: false
  decoder_distance: SinkhornLoss
  use_siamese: true
  aggregation: mean
  encoder:
    type: Performer
    n_heads: 2
    n_layers: 3
    d_model: 64
    feed_forward_hidden_dim: 128
  positional_encoding: SinusoidalAbsolutePositionalEncoding
batch_size: 128
learning_rate: 0.0001
debug_mode: true
loss_function: mse_loss
